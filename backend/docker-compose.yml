services:
  postgres:
    image: postgres:16
    container_name: lifeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeos_dev
    ports:
      - "5432:5432"
    volumes:
      - lifeos_pg_data:/var/lib/postgresql/data

volumes:
  lifeos_pg_data:
